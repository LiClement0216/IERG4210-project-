<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DnD - Reset Password</title>
  <link rel="stylesheet" href="/css/index.css">
  <link rel="stylesheet" href="/css/CRUD.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
  <header>
    <h1>Dessert not Desert</h1>
  </header>

  <main>
    <section class="content">
      <h2>Reset Password</h2>
      <form id="reset-form">
        <input type="hidden" name="csrfToken" value="">
        <table class="form-table">
          <tbody>
            <tr>
              <td><label for="token">Reset token:</label></td>
            </tr>
            <tr>
              <td><input type="text" id="token" name="token" required></td>
            </tr>
            <tr>
              <td><label for="newPassword">New password:</label></td>
            </tr>
            <tr>
              <td><input type="password" id="newPassword" name="newPassword" required></td>
            </tr>
            <tr>
              <td><label for="confirmNewPassword">Confirm new password:</label></td>
            </tr>
            <tr>
              <td><input type="password" id="confirmNewPassword" name="confirmNewPassword" required></td>
            </tr>
            <tr>
              <td><p id="message"></p></td>
            </tr>
            <tr>
              <td><input type="submit" class="reset-btn" value="Reset Password"></td>
            </tr>
          </tbody>
        </table>
      </form>
    </section>
  </main>

  <footer>
    <div>1155214218@2026</div>
    <div>Images not owned by me, site only for demo and education purpose.</div>
  </footer>

  <script src="/src/resetPassword.js"></script>
</body>
</html>
