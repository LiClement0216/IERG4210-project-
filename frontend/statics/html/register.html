<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DnD</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/CRUD.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>

    <header>
        <h1>Dessert not Desert</h1>
    </header>
    
    <main>
        <nav>
            <ol>
                <li><a href="/">Home</a></li>
                <li> > </li>
                <li><a href="#">register</a></li>
            </ol>
        </nav>
        <section class="content">
            <h2>Register</h2>
            <form id="register-form">
                <input type="hidden" name="csrfToken" value="">
                <table>
                    <tbody>
                        <tr>
                            <td>Email:</td>
                            <td><input type="email" id="username"></td>
                            <span id="username-error">Invalid email format.</span>
                        </tr>
                        <tr>
                            <td>Password:</td>
                            <td><input type="password" id="password"></td>
                        </tr>
                        <tr>
                            <td>Confirm password:</td>
                            <td>
                                <input type="password" id="confirm-password">
                                <br><span id="password-error">Passwords do not match.</span>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2"><button class="login-btn">Register</button></td>
                        </tr>
                    </tbody>
                </table>
            </form>
        </section>
    </main>
    
    <footer>  
        <div>1155214218@2026</div>
        <div>Images not owned by me, site only for demo and education purpose.</div>
    </footer>
    <script src="/src/register.js" defer></script>


</body>
