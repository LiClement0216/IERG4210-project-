<!DOCTYPE html>
<html>
<head>

  <link rel="stylesheet" href="/css/index.css">

<body>
  <header>
    <h1>Dessert not Desert</h1>
  </header>

  <main>
    <section class="content">
      <br>
      <h2>Forgot Password</h2>
      <form id="forgot-form">
        <input type="hidden" name="csrfToken" value="">
        <table class="form-table">
          <tbody>
            <tr>
              <td><label for="email">Email:</label></td>
            </tr>
            <tr>
              <td><input type="email" id="email" name="email" required></td>
            </tr>
            <tr>
              <td><input type="submit" class="reset-btn" value="Send"></td>
            </tr>
            <tr>
              <td><p id="message"></p></td>
            </tr>   
          </tbody>
        </table>
      </form>
    </section>
  </main>

  <footer>
    <div>1155214218@2026</div>

  </footer>

  <script src="/src/forgotPassword.js"></script>
