<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DnD</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/CRUD.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>

    <header>
        <h1>Dessert not Desert</h1>
    </header>
    
    <main>
        <nav>
            <ol>
                <li><a href="/">Home</a></li>
                <li> > </li>
                <li><a href="#">Change Password</a></li>
            </ol>
        </nav>
        <section class="content">
            <h2>Change Password</h2>
            <form id="change-password-form">
                <table>
                    <tbody>
                        <tr>
                            <td>Current password:</td>
                            <td><input type="password" id="current-password"></td>
                        </tr>
                        <tr>
                            <td>New password:</td>
                            <td><input type="password" id="new-password"></td>
                        </tr>
                        <tr>
                            <td>Confirm new password:</td>
                            <td>
                                <input type="password" id="confirm-new-password">
                                <br><span id="password-error">Passwords do not match.</span>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2"><button class="login-btn">Submit</button></td>
                        </tr>
                    </tbody>
                </table>
            </form>
        </section>
    </main>
    
    <footer>  
        <div>1155214218@2026</div>
        <div>Images not owned by me, site only for demo and education purpose.</div>
    </footer>
    <script src="/src/changePassword.js" defer></script>


</body>
